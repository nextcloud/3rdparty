# Copies all workflows from the default branch to the stable branches
# and then applies the `.github/workflows/*.patch` files of the stable branch
name: Sync workflows to stable branches

on: workflow_dispatch

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branches:
          - 'stable35'
          - 'stable34'
          - 'stable33'

    name: Sync workflows to ${{ matrix.branches }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: admin

      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout ${{ matrix.branches }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: target
          ref: ${{ matrix.branches }}

      - name: Copy workflows and apply patches
        run: |
          rm -f target/.github/workflows/*.yml
          cp source/.github/workflows/*.yml target/.github/workflows/
          rm target/.github/workflows/sync-workflows-stable.yml

          echo 'SUMMARY<<EOF' >> "$GITHUB_ENV"
          draft_only=0
          cd target
          for patch in .github/workflows/*.patch; do
            [ -f "$patch" ] || continue
            if patch -p1 --no-backup-if-mismatch < "$patch"; then
              echo "- 🩹 Applied \`$patch\`" >> "$GITHUB_ENV"
            else
              echo "- [ ] ❌ Failed to apply \`$patch\`" >> "$GITHUB_ENV"
              draft_only=1
            fi
          done
          find .github/workflows -name '*.rej' -delete
          echo 'EOF' >> "$GITHUB_ENV"
          echo "DRAFT_ONLY=${draft_only}" >> "$GITHUB_ENV"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.COMMAND_BOT_WORKFLOWS }}
          commit-message: 'ci(actions): Sync workflows from ${{ github.event.repository.default_branch }}'
          committer: GitHub <noreply@github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          path: target
          signoff: true
          branch: 'automated/noid/${{ matrix.branches }}-sync-workflows'
          title: '[${{ matrix.branches }}] ci(actions): Sync workflows from ${{ github.event.repository.default_branch }}'
          draft: ${{ env.DRAFT_ONLY == 1 }}
          add-paths: .github/workflows/*.yml
          body: |
            Automated sync of the workflows from `${{ github.event.repository.default_branch }}`
            ${{ env.SUMMARY }}
          labels: |
            github_actions
            ${{ matrix.branches }}
            3. to review
