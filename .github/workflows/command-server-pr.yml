name: Server PR comment

on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest-low

    # On pull requests and if the comment starts with `/server-pr`
    if: github.event.issue.pull_request != '' && startsWith(github.event.comment.body, '/server-pr')

    outputs:
      head_ref: ${{ steps.comment-branch.outputs.head_ref }}
      head_sha: ${{ steps.comment-branch.outputs.head_sha }}
      base_ref: ${{ steps.comment-branch.outputs.base_ref }}

    steps:
      - name: Get repository from pull request comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: get-repository
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const repositoryName = pull.data.head?.repo?.full_name
            console.log(repositoryName)
            return repositoryName

      - name: Disabled on forks
        if: ${{ fromJSON(steps.get-repository.outputs.result) != github.repository }}
        run: |
          echo 'Can not execute /server-pr on forks'
          exit 1

      - name: Check actor permission
        uses: skjnldsv/check-actor-permission@69e92a3c4711150929bca9fcf34448c5bf5526e7 # v3.0
        with:
          require: write

      - name: Add reaction on start
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }} # zizmor: ignore[secrets-outside-env]
          repository: ${{ github.event.repository.full_name }}
          comment-id: ${{ github.event.comment.id }}
          reactions: '+1'

      - name: Init branch
        uses: xt0rted/pull-request-comment-branch@e8b8daa837e8ea7331c0003c9c316a64c6d8b0b1 # v3.0.0
        id: comment-branch

      - name: Add reaction on failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: failure()
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }} # zizmor: ignore[secrets-outside-env]
          repository: ${{ github.event.repository.full_name }}
          comment-id: ${{ github.event.comment.id }}
          reactions: '-1'

  process:
    runs-on: ubuntu-latest-low
    needs: init

    env:
      HEAD_REF: ${{ needs.init.outputs.head_ref }}
      HEAD_SHA: ${{ needs.init.outputs.head_sha }}
      BASE_REF: ${{ needs.init.outputs.base_ref }}
      PR_NUMBER: ${{ github.event.issue.number }}
      PR_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.COMMAND_BOT_PAT }} # zizmor: ignore[secrets-outside-env]

    steps:
      - name: Checkout 3rdparty ${{ needs.init.outputs.head_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 3rdparty
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.init.outputs.head_sha }}

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none

      - name: Generate composer diff
        working-directory: 3rdparty
        run: |
          composer global config --no-interaction allow-plugins.ion-bazan/composer-diff true
          composer global require --no-interaction ion-bazan/composer-diff
          {
            echo "- [ ] 3rdparty: ${{ github.server_url }}/${{ github.repository }}/pull/$PR_NUMBER"
            echo
            composer diff --with-links --base "origin/$BASE_REF:composer.lock" --target composer.lock
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md"

      - name: Checkout server ${{ needs.init.outputs.base_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextcloud/server
          path: server
          persist-credentials: true
          # Pushing a new branch to server needs the `workflow` scope, as GitHub can not always verify in time that no workflow is changed
          token: ${{ secrets.COMMAND_BOT_WORKFLOWS }} # zizmor: ignore[secrets-outside-env]
          ref: ${{ needs.init.outputs.base_ref }}

      - name: Fail if branch already exists on server
        working-directory: server
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$HEAD_REF"; then
            echo "Branch $HEAD_REF already exists on nextcloud/server, not overwriting it"
            exit 1
          fi

      - name: Setup git
        working-directory: server
        run: |
          git config --local user.email 'nextcloud-command@users.noreply.github.com'
          git config --local user.name 'nextcloud-command'

      - name: Commit 3rdparty update and push
        working-directory: server
        run: |
          git checkout -b "$HEAD_REF"
          git update-index --cacheinfo "160000,$HEAD_SHA,3rdparty"
          git commit --signoff -m "$(sed -E 's/^\[stable[0-9.]*\] *//' <<< "$PR_TITLE")"
          git push origin "$HEAD_REF"

      - name: Create server pull request
        run: |
          url=$(gh pr create --repo nextcloud/server --base "$BASE_REF" --head "$HEAD_REF" \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          gh pr comment "$PR_NUMBER" --repo '${{ github.repository }}' --body "- Server PR: $url"

      - name: Add reaction on failure
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: failure()
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }} # zizmor: ignore[secrets-outside-env]
          repository: '${{ github.event.repository.full_name }}'
          comment-id: '${{ github.event.comment.id }}'
          reactions: '-1'
