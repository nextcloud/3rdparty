name: Update PRs titles

on:
  # pull_request_target is not suppressed by "[skip ci]" in the head commit, pull_request is
  # Safe as nothing from the PR is checked out or executed
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited]
    branches:
      - master
      - "stable*"

concurrency:
  group: stable-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-pr-title:
    runs-on: ubuntu-latest-low
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Wait for potential title edits
        run: sleep 15

      - name: Get PR details and update title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseBranch = pr.base.ref;
            const currentTitle = pr.title;

            // Dependabot commits carry "[skip ci]", which must not end up in the merge commit
            let newTitle = currentTitle.replace(/\[skip ci\]\s*/gi, '').trim();

            // Renovate already have target branch in the title
            if (baseBranch.startsWith('stable') && pr.user.login !== 'renovate[bot]') {
              // Remove all stable tags and add the correct one
              const cleanTitle = newTitle.replace(/\[stable[\d.]*\]\s*/g, '').trim();
              newTitle = `[${baseBranch}] ${cleanTitle}`;
            }

            if (newTitle === currentTitle) {
              console.log(`Title already correct: ${currentTitle}`);
              return;
            }

            console.log(`Updating title from: "${currentTitle}" to: "${newTitle}"`);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              title: newTitle,
            });
